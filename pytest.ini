[pytest]
addopts = -m "not llm_eval and not llm_live and not live_llm"
markers =
    llm_eval: tests that call the configured LLM/proxy API
    llm_live: live LLM/API tests; excluded from default runs
    live_llm: opt-in live LLM parser/API tests; excluded from default runs
    integration: opt-in integration tests that may call external services
